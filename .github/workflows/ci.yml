name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pricebot
          POSTGRES_USER: pricebot
          POSTGRES_PASSWORD: pricebot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/

      - name: Run tests
        env:
          PRICE_DATABASE_URL: postgresql://pricebot:pricebot@localhost:5432/pricebot
          PRICE_ANTHROPIC_API_KEY: test-key
          PRICE_TELEGRAM_BOT_TOKEN: "123:TEST"
        run: pytest -v --cov=ai_price_monitor --cov-report=term-missing
