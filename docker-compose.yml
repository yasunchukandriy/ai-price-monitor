services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pricebot
      POSTGRES_USER: pricebot
      POSTGRES_PASSWORD: pricebot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seed/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricebot"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      PRICE_DATABASE_URL: postgresql://pricebot:pricebot@postgres:5432/pricebot
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
